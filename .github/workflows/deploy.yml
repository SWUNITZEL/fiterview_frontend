name: Deploy React App to S3

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Setting .env
      run: |
          echo "REACT_APP_SPRING_API_URL=$REACT_APP_SPRING_API_URL" >> .env.production
          echo "REACT_APP_FASTAPI_API_URL=$REACT_APP_FASTAPI_API_URL" >> .env.production
          echo "REACT_APP_WS_API_URL=$REACT_APP_WS_API_URL" >> .env.production
          cat .env.production
    - name: Install dependencies
      run: npm install

    - name: Build project
      run: npm run build
      env:
        CI: false

    - name: Deploy to S3
      uses: jakejarvis/s3-sync-action@v0.5.1
      with:
        args: --delete
      env:
        AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        SOURCE_DIR: 'build'
